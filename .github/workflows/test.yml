name: Test

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      # OPC UA 模拟器服务 - 使用正确的端口映射
      opcua-simulator:
        image: mcr.microsoft.com/iotedge/opc-plc:latest
        ports:
          - 53530:50000  # 映射到测试期望的端口
          - 8080:8080    # Web 服务端口
        options: >-
          --health-cmd "timeout 10 bash -c '</dev/tcp/localhost/50000' || exit 1"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 10
        env:
          # OPC UA 模拟器配置
          OPCPLC_AUTOACCEPT: true
          OPCPLC_UNSECURETRANSPORT: true

      # Modbus 端到端测试用 simonvetter 库自带的进程内 server（无需外部服务，见 modbus points_test / iotread e2e_test，CI 直接可跑）。
      # 如需外部 Modbus 模拟器可启用下方（之前因启动不稳定禁用，保留作参考）：
      # modbus-simulator:
      #   image: techplex/modbus-sim:latest
      #   ports:
      #     - 1502:1502  # 注意：这个模拟器使用端口 1502
      #   options: >-
      #     --health-cmd "timeout 10 bash -c '</dev/tcp/localhost/1502' || exit 1"
      #     --health-interval 30s
      #     --health-timeout 10s
      #     --health-retries 6

      # VictoriaMetrics - 接收 Prometheus Remote Write（promremote 真实端到端测试，单二进制最轻量）
      victoriametrics:
        image: victoriametrics/victoria-metrics:latest
        ports:
          - 8428:8428
        command: ["-httpListenAddr=:8428"]

      # TimescaleDB - timescaledb tsdb 驱动真实端到端
      timescaledb:
        image: timescale/timescaledb:latest-pg16
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      # InfluxDB 2.x - influxdb tsdb 驱动真实端到端（setup 模式自动初始化 org/bucket/token）
      influxdb:
        image: influxdb:2.7-alpine
        ports:
          - 8086:8086
        env:
          DOCKER_INFLUXDB_INIT_MODE: setup
          DOCKER_INFLUXDB_INIT_USERNAME: e2e
          DOCKER_INFLUXDB_INIT_PASSWORD: e2e-password
          DOCKER_INFLUXDB_INIT_ORG: rulego
          DOCKER_INFLUXDB_INIT_BUCKET: iot
          DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: e2e-test-token
          DOCKER_INFLUXDB_INIT_RETENTION: 0

      # TDengine - tdengine tsdb 驱动真实端到端
      tdengine:
        image: tdengine/tdengine:3.3.2.0
        ports:
          - 6030:6030
          - 6041:6041

      # OpenGemini - opengemini tsdb 驱动真实端到端（host 用 8087 避开 influxdb 占用的 8086）
      opengemini:
        image: opengemini/opengemini:latest
        ports:
          - 8087:8086

    strategy:
      matrix:
        # go.mod 要求 go >= 1.24.7（gosnmp 等依赖带入）
        go-version: ['1.24.7', '1.25.x']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ matrix.go-version }}

    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-${{ matrix.go-version }}-

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Vet
      run: go vet ./...
      continue-on-error: true

    - name: Wait for services to be ready
      run: |
        echo "等待服务就绪..."
        
        # 等待 OPC UA 模拟器启动
        if [ "$SKIP_OPCUA_TESTS" != "true" ]; then
          echo "等待 OPC UA 模拟器启动 (端口 53530)..."
          timeout 120 sh -c 'until nc -z localhost 53530; do echo "等待中..."; sleep 3; done'
          echo "OPC UA 模拟器已就绪!"
          
          # 验证 OPC UA 服务器响应
          echo "验证 OPC UA 服务器响应..."
          timeout 30 sh -c 'until curl -sf http://localhost:8080/pn.json > /dev/null 2>&1; do echo "等待 Web 接口..."; sleep 2; done' || echo "Web 接口可能不可用，继续测试"
        else
          echo "跳过 OPC UA 服务检查"
        fi
        
        # Modbus 测试已跳过 - 模拟器启动不稳定
        echo "跳过 Modbus 服务检查 (SKIP_MODBUS_TESTS=true)"

        # 等待时序数据库服务就绪（e2e 测试依赖；超时不阻断，测试侧 skip 兜底）
        for port in 5432 8086 6030 8087; do
          timeout 90 sh -c "until nc -z localhost $port; do echo \"等待端口 $port...\"; sleep 3; done" || echo "端口 $port 未就绪，相关 e2e 测试将 skip"
        done

    - name: Run tests with coverage
      env:
        # 启用集成测试
        INTEGRATION_TESTS: true
        
        # OPC UA 配置
        OPCUA_ENDPOINT: opc.tcp://localhost:53530
        OPCUA_SERVER_URL: opc.tcp://localhost:53530/OPCUA/SimulationServer
        
        # Modbus 配置
        MODBUS_SERVER_HOST: localhost
        MODBUS_SERVER_PORT: 1502
        
        # 测试控制环境变量 - 根据服务可用性动态设置
        SKIP_OPCUA_TESTS: false     # OPC UA 有模拟器，可以测试
        SKIP_MODBUS_TESTS: true     # 暂时跳过 Modbus 测试（模拟器不稳定）
        
        # 其他 IoT 协议暂时跳过（需要物理设备或特殊设置）
        SKIP_BACNET_TESTS: true     # BACnet 需要物理设备
        SKIP_IEC61850_TESTS: true   # IEC61850 需要特殊设置
        SKIP_S7_TESTS: true         # Siemens S7 需要物理设备
        SKIP_ETHERNET_IP_TESTS: true # Ethernet/IP 需要物理设备
        
        # 时序数据库真实端到端（services 已起；各 e2e 测试未设对应变量则 skip）
        E2E_VICTORIAMETRICS_URL: http://localhost:8428
        E2E_TIMESCALEDB_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        E2E_INFLUXDB_URL: http://localhost:8086
        E2E_INFLUXDB_TOKEN: e2e-test-token
        E2E_INFLUXDB_ORG: rulego
        E2E_INFLUXDB_BUCKET: iot
        E2E_TDENGINE_DSN: root:taosdata@http(localhost:6041)/
        E2E_OPENGEMINI_ADDR: localhost:8087

        # 测试超时设置
        TEST_TIMEOUT: 45s
      run: |
        # 运行测试并生成覆盖率报告
        go test -v -race -timeout=8m -coverprofile=coverage.out -covermode=atomic ./...

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.out
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
